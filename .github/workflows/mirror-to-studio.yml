name: Mirror WR-AI to WR-AI-studio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror all Git refs
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "::error::Repository secret MIRROR_TOKEN is missing."
            exit 1
          fi

          AUTH="$(printf 'x-access-token:%s' "$MIRROR_TOKEN" | base64 -w 0)"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"

          git clone --mirror https://github.com/yooyoo78/WR-AI.git
          cd WR-AI.git
          git push --mirror https://github.com/yooyoo78/WR-AI-studio-.git

          git remote remove origin || true
