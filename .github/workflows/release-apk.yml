name: Android Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag / version label (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string
      publish_release:
        description: "Create GitHub Release and attach signed APK"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate CI debug keystore for unit tests
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure google-services.json is available
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
            else
              echo "::warning::app/google-services.json not found. Gemini AI Coach will require Firebase config at build time."
            fi
          fi

      # No Gradle wrapper scripts/jar are committed in this repository.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run Android unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required GitHub Secrets: KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD (for keyAlias 'upload')."
            exit 1
          fi

      - name: Decode release upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
          ls -lh "${{ github.workspace }}/my-upload-key.jks"

      - name: Assemble signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Package release APK output
        id: package_apk
        run: |
          TAG_NAME="${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}"
          SAFE_TAG="${TAG_NAME//\//-}"
          mkdir -p dist
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release"
            exit 1
          fi
          APK_DEST="dist/rift-companion-${SAFE_TAG}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "apk_path=$APK_DEST" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_DEST"

      - name: Clean up release keystore
        if: always()
        run: rm -f "${{ github.workspace }}/my-upload-key.jks"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rift-companion-release-apk
          path: ${{ steps.package_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_apk.outputs.tag_name }}
          name: "Rift Companion ${{ steps.package_apk.outputs.tag_name }}"
          files: ${{ steps.package_apk.outputs.apk_path }}
          generate_release_notes: true
