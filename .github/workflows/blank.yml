name: Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Generate CI debug signing keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure google-services.json is available
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              if ! echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json; then
                echo "::error::Failed to decode GOOGLE_SERVICES_JSON_BASE64 secret. Make sure it is valid Base64."
                exit 1
              fi
              if ! python3 -m json.tool app/google-services.json > /dev/null 2>&1; then
                echo "::error::Decoded GOOGLE_SERVICES_JSON_BASE64 is not valid JSON."
                exit 1
              fi
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
            else
              echo "::warning::app/google-services.json not found. Gemini AI Coach will require Firebase config at build time."
            fi
          fi

      # No Gradle wrapper scripts/jar are committed in this repository.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      # Robolectric tests targeting Android API 36 require Java 21.
      - name: Run Android unit tests
        run: >-
          gradle :app:testDebugUnitTest --no-daemon --stacktrace
          -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2
          -Drobolectric.dependency.repo.id=central

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wild-rift-assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
